#!/bin/bash
# ============================================================
# openGauss HA Cluster - 全局配置文件
# 本文件在所有节点间保持一致，每个节点上按需修改以下内容：
#   [etcd]  等第 IP 列表
#   [nodes] 数据库节点 IP 列表
#   [auth]  数据库凭证
#   [patroni] 调优参数
# ============================================================

# ============================================================
# [etcd] 集群配置（3 节点，可部署在双机房或三机房）
# 格式: name=ip  (IP 用真实物理 IP/HOST IP)
# ============================================================
ETCD_A1=etcd-a1:10.168.207.76
ETCD_B1=etcd-b1:10.168.207.77
ETCD_C1=etcd-c1:10.168.207.78

# etcd 集群 token (所有节点一致)
ETCD_CLUSTER_TOKEN=opengauss-ha-cluster-1

# ============================================================
# [nodes] openGauss 数据库节点
# 格式: name=ip:role  (role: leader | standby)
# ============================================================
MASTER=master:10.168.207.76:leader
SLAVE01=slave01:10.168.207.77:standby
SLAVE02=slave02:10.168.207.78:standby

# ============================================================
# [auth] 数据库与管理凭证
# ============================================================
GAUSS_USER=gauss
GAUSS_PASSWORD=SecurePass123
GAUSS_DATABASE=test

# ============================================================
# [patroni] Patroni 调优参数
# ============================================================
LOOP_WAIT=10
RETRY_TIMEOUT=30
TTL=60
SYNCHRONOUS_MODE=false
MAXIMUM_LAG_ON_FAILOVER=104857600

# ============================================================
# [db] 数据库参数
# ============================================================
MAX_CONNECTIONS=1000
WAL_LEVEL=logical
DB_PORT=5432

# ============================================================
# [docker] 镜像版本
# ============================================================
OPEN_GAUSS_VERSION=5.0.3_arm
