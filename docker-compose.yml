version: "3"
# ============================================================
# openGauss HA Cluster - Multi-DC Docker Compose
# 使用 host 网络模式，保证跨机房端口可达
#
# compact 模式 : etcd + openGauss 同节点
# dedicated 模式: 独立 etcd 节点 + 独立 DB 节点
#
# 由 deploy.sh 读取 cluster.conf 生成 .env 后调用
# ============================================================
services:
  opengauss:
    image: opengauss-ha:${OPEN_GAUSS_VERSION:-5.0.3_arm}
    restart: always
    container_name: ${CONTAINER_NAME:-opengauss}
    hostname: ${CONTAINER_NAME:-opengauss}
    privileged: true
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      # 节点标识
      RUN_MODE: ${RUN_MODE}
      NODE_NAME: ${NODE_NAME}
      HOST_IP: ${HOST_IP}
      # etcd 集群
      ETCD_PEERS: ${ETCD_PEERS:-}
      ETCD_HOSTS: ${ETCD_HOSTS:-}
      ETCD_CLUSTER_TOKEN: ${ETCD_CLUSTER_TOKEN:-}
      CLUSTER_NEW: ${CLUSTER_NEW:-false}
      # DB 集群
      HOST_NAMES: ${HOST_NAMES:-}
      HOST_IPS: ${HOST_IPS:-}
      # 凭证
      GAUSS_USER: ${GAUSS_USER}
      GAUSS_PASSWORD: ${GAUSS_PASSWORD}
      GAUSS_DATABASE: ${GAUSS_DATABASE:-test}
      # Patroni
      LOOP_WAIT: ${LOOP_WAIT:-10}
      RETRY_TIMEOUT: ${RETRY_TIMEOUT:-30}
      TTL: ${TTL:-60}
      SYNCHRONOUS_MODE: ${SYNCHRONOUS_MODE:-false}
      MAXIMUM_LAG_ON_FAILOVER: ${MAXIMUM_LAG_ON_FAILOVER:-104857600}
      # DB 参数
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-1000}
      WAL_LEVEL: ${WAL_LEVEL:-logical}
    volumes:
      - ./data/${CONTAINER_NAME:-opengauss}/data:/opt/software/openGauss/data
      - ./data/${CONTAINER_NAME:-opengauss}/logs:/opt/software/openGauss/logs
